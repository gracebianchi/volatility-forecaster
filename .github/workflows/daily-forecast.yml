name: Daily forecast

on:
  schedule:
    # 22:30 UTC on weekdays — comfortably after the US close in both EST
    # (21:00 UTC) and EDT (20:00 UTC), giving Yahoo time to settle the bar.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      refit:
        description: "Refit the model before forecasting"
        type: boolean
        default: false

concurrency:
  # Shared with the manual dashboard deploy so two runs cannot publish at once.
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run forecast
        run: |
          vol-forecast ${{ inputs.refit && '--refit' || '' }}

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts docs/data models
          # A holiday or a rerun produces no new row; that is a success, not a failure.
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "forecast: $(date -u +%Y-%m-%d)"
          git push

      # Publishing happens here, in the same run, on purpose. With branch-based
      # Pages the site rebuild is itself a workflow triggered by the push — and
      # a push made with GITHUB_TOKEN deliberately does not trigger workflows,
      # so the commit above would land without the site ever updating.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
